<!doctype html>
<html lang="en" data-framework="web-native">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A TodoMVC app written with web-native custom elements." />
    <title>TodoMVC: web-native</title>
    <link rel="icon" href="data:," />
    <script>
      ;(() => {
        const media = matchMedia("(prefers-color-scheme: dark)")
        const syncTheme = () => {
          document.documentElement.dataset.theme = media.matches ? "dark" : "light"
        }

        syncTheme()
        media.addEventListener("change", syncTheme)
      })()
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/subtleGradient/web-native@7ed806104e4b9dcce8b91044149cb721f2b1e9cf/src/shadcn.web/themes/neutral.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/subtleGradient/web-native@7ed806104e4b9dcce8b91044149cb721f2b1e9cf/src/shadcn.web/styles/base-nova.css" />
    <script type="importmap">
      {
        "imports": {
          "web-native/": "https://cdn.jsdelivr.net/gh/subtleGradient/web-native@13e90f5f73581dac30c1f10310d1a2fe344489a8/src/"
        }
      }
    </script>
    <script type="module">
      import "https://cdn.jsdelivr.net/gh/subtleGradient/web-native@e6d861c101d885abfae0b4fd27a5bfa2eb2b9510/src/shadcn.web/define.js"
      import "https://cdn.jsdelivr.net/gh/subtleGradient/web-native@bbe5671ac74004620daa9a35d0e1296710a70fdb/examples/todomvc/app/app.js"
    </script>
  </head>
  <body>
    <todo-app></todo-app>
    <footer class="info">
      <p>Double-click to edit a todo</p>
      <p>Created with web-native custom elements</p>
      <p>Part of <a href="https://todomvc.com">TodoMVC</a></p>
    </footer>
  </body>
</html>
