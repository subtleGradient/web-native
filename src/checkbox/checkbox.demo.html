<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>base-checkbox demo</title>
    <script>
      (() => {
        const media = matchMedia("(prefers-color-scheme: dark)")
        const syncTheme = () => {
          document.documentElement.dataset.theme = media.matches ? "dark" : "light"
        }

        syncTheme()
        media.addEventListener("change", syncTheme)
      })()
    </script>
    <script type="module" src="./define.js"></script>
    <style>
      :root { color-scheme: light dark; }
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }

      body {
        background: Canvas;
        color: CanvasText;
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }

      main {
        display: grid;
        gap: 1rem;
        max-width: 32rem;
      }

      base-checkbox {
        align-items: center;
        border: 1px solid CanvasText;
        border-radius: 0.25rem;
        display: inline-flex;
        gap: 0.5rem;
        min-height: 2rem;
        padding: 0.25rem 0.5rem;
        width: fit-content;
      }

      base-checkbox:focus-visible {
        outline: 2px solid Highlight;
        outline-offset: 2px;
      }

      base-checkbox[data-active] {
        transform: translateY(1px);
      }

      base-checkbox[data-checked],
      base-checkbox[data-indeterminate] {
        background: Highlight;
        color: HighlightText;
      }

      base-checkbox[data-disabled] {
        opacity: 0.5;
      }

      #event-log {
        color: GrayText;
        min-height: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>base-checkbox</h1>
      <base-checkbox id="terms">Accept terms</base-checkbox>
      <base-checkbox checked>Email updates</base-checkbox>
      <base-checkbox indeterminate>Select visible projects</base-checkbox>
      <base-checkbox disabled>Disabled option</base-checkbox>
      <p id="event-log" aria-live="polite"></p>
    </main>

    <script type="module">
      const log = document.querySelector("#event-log")
      document.querySelector("#terms")?.addEventListener("base-ui:checked-change", (event) => {
        log.textContent = `Checked: ${event.detail.checked}`
      })
    </script>
  </body>
</html>
