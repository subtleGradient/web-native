<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>CodeMirror web component demo</title>
    <script type="module" src="https://cdn.jsdelivr.net/gh/subtleGradient/web-native@4797f0da2c40f024cab603a3120cd255cde76650/src/codemirror.web/define.js"></script>
    <style>
      :root {
        --accent: Highlight;
        --border: color-mix(in oklch, CanvasText 13%, transparent);
        --muted: color-mix(in oklch, CanvasText 62%, transparent);
        --surface: color-mix(in oklch, Canvas 96%, CanvasText 4%);
        --surface-strong: color-mix(in oklch, Canvas 91%, CanvasText 9%);
        color-scheme: light dark;
      }

      body {
        background: Canvas;
        color: CanvasText;
        font-family: ui-sans-serif, system-ui, sans-serif;
        line-height: 1.5;
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }

      main {
        display: grid;
        gap: 1.25rem;
        margin-inline: auto;
        max-inline-size: 72rem;
        padding: clamp(1rem, 4vw, 2rem);
      }

      header {
        display: grid;
        gap: 0.35rem;
        max-inline-size: 52rem;
        padding-block: clamp(0.5rem, 3vw, 2rem) 0.25rem;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3.75rem);
        font-weight: 650;
        letter-spacing: 0;
        line-height: 1;
        margin: 0;
      }

      p {
        color: var(--muted);
        margin: 0;
        max-inline-size: 66ch;
      }

      form {
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        display: grid;
        overflow: clip;
      }

      .form-header {
        align-items: end;
        background: var(--surface);
        border-block-end: 1px solid color-mix(in oklch, CanvasText 8%, transparent);
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: space-between;
        padding: 1rem;
      }

      .field-copy {
        display: grid;
        gap: 0.15rem;
      }

      .field-title {
        font-size: 0.875rem;
        font-weight: 700;
      }

      .field-description {
        color: var(--muted);
        font-size: 0.875rem;
      }

      codemirror-editor,
      codemirror-json,
      codemirror-markdown {
        --codemirror-editor-min-block-size: 18rem;
        padding: 1rem;
      }

      .examples {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .example {
        display: grid;
        gap: 0.5rem;
      }

      .example codemirror-json,
      .example codemirror-markdown {
        --codemirror-editor-min-block-size: 10rem;
        padding: 0;
      }

      button {
        background: ButtonFace;
        border: 1px solid var(--border);
        border-radius: 0.375rem;
        color: ButtonText;
        cursor: pointer;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 750;
        min-block-size: 2.25rem;
        padding: 0.45rem 0.75rem;
        width: fit-content;
      }

      button:focus-visible {
        outline: 2px solid color-mix(in oklch, var(--accent) 76%, CanvasText 24%);
        outline-offset: 2px;
      }

      button:hover {
        background: var(--surface-strong);
      }

      output {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        display: block;
        font: 0.875rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        min-block-size: 3rem;
        overflow: auto;
        padding: 0.875rem;
        white-space: pre-wrap;
      }

      output:empty::before {
        color: var(--muted);
        content: "Submit the form to inspect the native FormData value.";
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      @media (max-width: 48rem) {
        .form-header,
        .examples {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
        }

        codemirror-editor,
        codemirror-json,
        codemirror-markdown {
          padding: 0.75rem;
        }

        button {
          width: 100%;
        }
      }
    </style>
    <script>
      globalThis.codeDemo = {
        submit(event) {
          event.preventDefault()
          const form = event.currentTarget
          const data = new FormData(form)
          document.querySelector("output").value = data.get("code")
        },
      }
    </script>
  </head>
  <body>
    <main>
      <header>
        <h1>CodeMirror web components</h1>
        <p>Wrap a textarea to get a CodeMirror editor. The textarea stays in the page, so forms and fallback behavior remain native.</p>
      </header>

      <form onsubmit="codeDemo.submit(event)">
        <div class="form-header">
          <div class="field-copy">
            <label class="field-title" for="demo-code">JavaScript source</label>
            <span class="field-description">Edit in CodeMirror, then submit to read the textarea-backed form value.</span>
          </div>
          <button type="submit">Read FormData</button>
        </div>
        <codemirror-editor language="javascript" line-wrapping tab-size="2">
          <textarea id="demo-code" name="code" aria-label="JavaScript source">const messages = ["native textarea", "CodeMirror editor", "form value"]

for (const message of messages) {
  console.log(message)
}</textarea>
        </codemirror-editor>
      </form>

      <section class="examples" aria-label="Alias examples">
        <div class="example">
          <p class="field-title">JSON alias</p>
          <codemirror-json setup="minimal">
            <textarea name="settings" aria-label="JSON settings">{
  "theme": "system",
  "lineWrapping": true
}</textarea>
          </codemirror-json>
        </div>
        <div class="example">
          <p class="field-title">Markdown alias</p>
          <codemirror-markdown setup="minimal" line-wrapping>
            <textarea name="notes" aria-label="Markdown notes"># Release notes

- Textarea fallback first
- CodeMirror when modules load</textarea>
          </codemirror-markdown>
        </div>
      </section>

      <output aria-label="Submitted code"></output>
    </main>
  </body>
</html>
