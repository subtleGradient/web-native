<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>base-switch stories</title>
    <script type="module" src="./define.js"></script>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { background: Canvas; color: CanvasText; font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; }
      main { display: grid; gap: 1rem; margin-inline: auto; max-width: 48rem; padding: clamp(1rem, 4vw, 3rem); }
      h1 { font-size: clamp(2rem, 7vw, 4rem); letter-spacing: -0.06em; line-height: 0.9; margin: 0; }
      h2, p { margin-block: 0; }
      .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
      [data-story] { background: color-mix(in oklch, Canvas 92%, CanvasText 8%); border: 1px solid color-mix(in oklch, CanvasText 14%, transparent); border-radius: 1rem; display: grid; gap: 0.75rem; padding: 1rem; }
      .stack, form { display: grid; gap: 0.5rem; }
      .row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      base-switch { align-items: center; background: Canvas; border: 1px solid color-mix(in oklch, CanvasText 24%, transparent); border-radius: 0.65rem; display: inline-flex; gap: 0.5rem; min-height: 2.4rem; padding: 0.45rem 0.75rem; width: fit-content; }
      base-switch::before { background: color-mix(in oklch, Canvas 82%, CanvasText 18%); border-radius: 999px; block-size: 1rem; box-shadow: inset 0.75rem 0 0 CanvasText; content: ""; inline-size: 1.9rem; }
      base-switch[data-checked]::before { background: Highlight; box-shadow: inset -0.75rem 0 0 HighlightText; }
      base-switch[data-disabled] { opacity: 0.5; }
      base-switch[data-active] { transform: translateY(1px); }
      base-switch:focus-visible, button:focus-visible { outline: 3px solid Highlight; outline-offset: 2px; }
      button { background: CanvasText; border: 0; border-radius: 0.65rem; color: Canvas; font: inherit; font-weight: 700; min-height: 2.4rem; padding-inline: 0.85rem; }
      output { color: color-mix(in oklch, CanvasText 62%, transparent); min-height: 1.5rem; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>base-switch</h1>
        <p>Local stories for off, on, disabled, required, canceled, keyboard, and FormData states.</p>
      </header>
      <div class="grid">
        <section data-story="states">
          <h2>States</h2>
          <div class="stack">
            <base-switch id="switch-interactive" name="alerts" value="on" unchecked-value="off">Alerts off</base-switch>
            <base-switch checked>Checked</base-switch>
            <base-switch disabled>Disabled</base-switch>
            <base-switch required id="switch-required">Required switch</base-switch>
          </div>
        </section>
        <section data-story="form-associated">
          <h2>Form associated</h2>
          <form id="switch-form" onsubmit="SwitchStories.readForm(event)" onreset="SwitchStories.resetForm()">
            <base-switch name="security" checked value="on" unchecked-value="off">Security digest</base-switch>
            <base-switch name="beta" value="yes" unchecked-value="no">Beta access</base-switch>
            <div class="row">
              <button>Read FormData</button>
              <button type="reset">Reset</button>
            </div>
          </form>
          <output id="switch-form-output">Submit to inspect values.</output>
        </section>
        <section data-story="cancelable-event">
          <h2>Cancelable event</h2>
          <base-switch id="switch-cancel">Canceled change stays off</base-switch>
          <output id="switch-event-output">No event yet.</output>
        </section>
      </div>
    </main>
    <script type="module">
      await customElements.whenDefined("base-switch")
      const eventOutput = document.querySelector("#switch-event-output")
      document.querySelector("#switch-cancel")?.addEventListener("base-ui:checked-change", (event) => {
        event.preventDefault()
        eventOutput.textContent = "Canceled checked change."
      })
      globalThis.SwitchStories = {
        readForm(event) {
          event.preventDefault()
          document.querySelector("#switch-form-output").textContent = new URLSearchParams(new FormData(event.currentTarget)).toString()
        },
        resetForm() {
          requestAnimationFrame(() => {
            document.querySelector("#switch-form-output").textContent = "Form reset."
          })
        },
      }
      globalThis.__webNativeSwitchStoriesReady = true
    </script>
  </body>
</html>
