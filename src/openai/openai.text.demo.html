<!doctype html>
<!--
Run from a local checkout:
bun ./src/openai/scripts/openai-runner.ts src/openai/openai.text.demo.html

Security: only run demos you trust. This page sends requests through the runner's local Codex broker.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./openai.demo.css" />
    <title>OpenAI text demo</title>
    <script type="module" src="./define.js"></script>
    <script type="module" src="./openai.demo.js"></script>
  </head>
  <body>
    <main>
      <a class="back" data-preserve-search href="./openai.demo.html">← All OpenAI demos</a>
      <header>
        <h1>Text</h1>
        <p>Send instructions and a prompt to the Responses API.</p>
      </header>

      <openai-client id="ai" model="gpt-5.5" transport="codex-broker"></openai-client>

      <form class="panel" onsubmit="ai.respond(event)">
        <h2>Request</h2>
        <label>Instructions<textarea name="instructions">Answer clearly and briefly.</textarea></label>
        <label>Prompt<textarea name="prompt">Say hello in one sentence.</textarea></label>
        <button>Ask</button>
      </form>

      <openai-result for="ai"></openai-result>
    </main>
  </body>
</html>
