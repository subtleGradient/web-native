<!doctype html>
<!--
Run this demo with the Codex broker
These demos are hard-coded to the local Codex broker exposed by openai-runner.
GitHub:
bunx --bun -p https://github.com/subtleGradient/web-native/archive/refs/heads/openai.tar.gz web-native-openai src/openai/examples.web/openai.image.demo.html
Local checkout:
bun "./src/openai/Example OpenAI Codex Broker.webapp/openai-runner.ts" src/openai/examples.web/openai.image.demo.html

Security: only run demos you trust. This page sends requests through the runner's local Codex broker.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./openai.demo.css" />
    <title>OpenAI image demo</title>
    <script type="module" src="../define.js"></script>
    <script type="module" src="./openai.demo.js"></script>
  </head>
  <body>
    <main>
      <a class="back" data-preserve-search href="./index.html">← All OpenAI demos</a>
      <header>
        <h1>Image</h1>
        <p>Generate an image through the Responses image generation tool.</p>
      </header>

      <openai-client id="ai" model="gpt-5.5" transport="codex-broker"></openai-client>

      <form class="panel" onsubmit="ai.generateImage(event)">
        <h2>Request</h2>
        <label>Prompt<textarea name="prompt">tiny watercolor robot on a white background</textarea></label>
        <label>
          Format
          <select name="outputFormat">
            <option>png</option>
            <option>webp</option>
            <option>jpeg</option>
          </select>
        </label>
        <button>Generate image</button>
      </form>

      <openai-result for="ai"></openai-result>
    </main>
  </body>
</html>
