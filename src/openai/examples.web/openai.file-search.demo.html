<!doctype html>
<!--
Run this demo with the Codex broker
These demos are hard-coded to the local Codex broker exposed by openai-runner.
GitHub:
bunx --bun -p https://github.com/subtleGradient/web-native/archive/refs/heads/main.tar.gz web-native-openai src/openai/examples/openai.file-search.demo.html
Local checkout:
bun "./src/openai/Example OpenAI Codex Broker.webapp/openai-runner.ts" src/openai/examples/openai.file-search.demo.html

Security: only run demos you trust. This page sends requests through the runner's local Codex broker.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./openai.demo.css" />
    <title>OpenAI file search demo</title>
    <script type="module" src="../define.js"></script>
    <script type="module" src="./openai.demo.js"></script>
  </head>
  <body>
    <main>
      <a class="back" data-preserve-search href="./index.html">← All OpenAI demos</a>
      <header>
        <h1>File search</h1>
        <p>Query a vector store that already has uploaded files.</p>
      </header>

      <openai-client id="ai" model="gpt-5.5" transport="codex-broker"></openai-client>

      <form class="panel" onsubmit="ai.respondWithTools(event)">
        <h2>Request</h2>
        <p class="note">Requires a vector store that already has uploaded files.</p>
        <label>Prompt<textarea name="prompt">What are the most important facts in this knowledge base?</textarea></label>
        <label>Tools JSON<textarea name="tools">[{"type":"file_search","vector_store_ids":["vs_replace_me"],"max_num_results":3}]</textarea></label>
        <label>Include JSON<textarea name="include">["file_search_call.results"]</textarea></label>
        <button>Search files</button>
      </form>

      <openai-result for="ai"></openai-result>
    </main>
  </body>
</html>
