<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>standalone base-toggle demo</title>
    <script>
      (() => {
        const media = matchMedia("(prefers-color-scheme: dark)")
        const syncTheme = () => {
          document.documentElement.dataset.theme = media.matches ? "dark" : "light"
        }

        syncTheme()
        media.addEventListener("change", syncTheme)
      })()
    </script>
    <script type="module" src="https://cdn.jsdelivr.net/gh/subtleGradient/web-native@561265129bd238e6e6b4dd4650a6ff6402ea16d4/src/base.web/toggle/define.js"></script>
    <style>
      :root { color-scheme: light dark; }
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      body { background: Canvas; color: CanvasText; font-family: system-ui, sans-serif; margin: 2rem; }
      main { display: grid; gap: 1rem; max-width: 32rem; }
      base-toggle { border: 1px solid CanvasText; border-radius: 0.5rem; display: inline-flex; padding: 0.5rem 0.75rem; width: fit-content; }
      base-toggle:focus-visible { outline: 2px solid Highlight; outline-offset: 2px; }
      base-toggle[data-active] { transform: translateY(1px); }
      base-toggle[data-pressed] { background: Highlight; color: HighlightText; }
      base-toggle[data-disabled] { opacity: 0.5; }
      #event-log { color: GrayText; min-height: 1.5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>standalone base-toggle</h1>
      <p>Open this file directly. The component module is loaded from the GitHub branch through jsDelivr.</p>
      <base-toggle id="bold">Bold</base-toggle>
      <base-toggle pressed>Italic</base-toggle>
      <base-toggle disabled>Disabled</base-toggle>
      <p id="event-log" aria-live="polite">Pressed: false</p>
    </main>
    <script type="module">
      await customElements.whenDefined("base-toggle")
      const log = document.querySelector("#event-log")
      document.querySelector("#bold")?.addEventListener("base-ui:pressed-change", (event) => {
        log.textContent = `Pressed: ${event.detail.pressed}`
      })
      Reflect.set(globalThis, "__webNativeStandaloneDemoReady", true)
    </script>
  </body>
</html>
