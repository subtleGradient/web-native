<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>standalone base-separator demo</title>
    <script>
      (() => {
        const media = matchMedia("(prefers-color-scheme: dark)")
        const syncTheme = () => {
          document.documentElement.dataset.theme = media.matches ? "dark" : "light"
        }

        syncTheme()
        media.addEventListener("change", syncTheme)
      })()
    </script>
    <script type="module" src="https://cdn.jsdelivr.net/gh/subtleGradient/web-native@7c698abd8a6d92ccc883722914876f42b20b267f/src/base.web/separator/define.js"></script>
    <style>
      :root { color-scheme: light dark; }
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      body { background: Canvas; color: CanvasText; font-family: system-ui, sans-serif; margin: 2rem; }
      main { display: grid; gap: 1rem; max-width: 32rem; }
      base-separator { background: CanvasText; display: block; opacity: 0.25; }
      base-separator[data-orientation="horizontal"] { height: 1px; width: 100%; }
      base-separator[data-orientation="vertical"] { align-self: stretch; width: 1px; }
      .row { align-items: center; display: flex; gap: 1rem; min-height: 4rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>standalone base-separator</h1>
      <p>Open this file directly. The component module is loaded from the GitHub branch through jsDelivr.</p>
      <p>Before</p>
      <base-separator></base-separator>
      <p>After</p>
      <div class="row"><span>Left</span><base-separator orientation="vertical"></base-separator><span>Right</span></div>
    </main>
    <script type="module">
      await customElements.whenDefined("base-separator")
      Reflect.set(globalThis, "__webNativeStandaloneDemoReady", true)
    </script>
  </body>
</html>
