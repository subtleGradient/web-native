<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>standalone shadcn presentational demo</title>
    <script>
      (() => {
        const media = matchMedia("(prefers-color-scheme: dark)")
        const syncTheme = () => {
          document.documentElement.dataset.theme = media.matches ? "dark" : "light"
        }

        syncTheme()
        media.addEventListener("change", syncTheme)
      })()
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/subtleGradient/web-native@7ed806104e4b9dcce8b91044149cb721f2b1e9cf/src/shadcn.web/themes/neutral.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/subtleGradient/web-native@7ed806104e4b9dcce8b91044149cb721f2b1e9cf/src/shadcn.web/styles/base-nova.css" />
    <script type="importmap">{ "imports": { "web-native/": "https://cdn.jsdelivr.net/gh/subtleGradient/web-native@dd21d01da080b25e1269b23e68915d6404e8099d/src/" } }</script>
    <script type="module">
      import "https://cdn.jsdelivr.net/gh/subtleGradient/web-native@7ed806104e4b9dcce8b91044149cb721f2b1e9cf/src/shadcn.web/presentational/define.js"
      await customElements.whenDefined("shadcn-card")
      Reflect.set(globalThis, "__webNativeStandaloneDemoReady", true)
    </script>
    <style>body { margin: 2rem; } main { display: grid; gap: 1rem; max-width: 48rem; } .row { align-items: center; display: flex; flex-wrap: wrap; gap: 0.5rem; } shadcn-skeleton { height: 1rem; width: 14rem; }</style>
  </head>
  <body>
    <main>
      <h1>standalone shadcn presentational</h1>
      <p>Open this file directly. CSS and ESM load from GitHub through jsDelivr.</p>
      <div class="row"><shadcn-badge>Default</shadcn-badge><shadcn-badge variant="secondary">Secondary</shadcn-badge><shadcn-badge variant="outline">Outline</shadcn-badge></div>
      <shadcn-alert><shadcn-alert-title>Status</shadcn-alert-title><shadcn-alert-description>Everything is working.</shadcn-alert-description></shadcn-alert>
      <shadcn-card>
        <shadcn-card-header><shadcn-card-title>Card title</shadcn-card-title><shadcn-card-description>Card description</shadcn-card-description></shadcn-card-header>
        <shadcn-card-content>Card content</shadcn-card-content>
        <shadcn-card-footer><shadcn-kbd-group><shadcn-kbd>Ctrl</shadcn-kbd><shadcn-kbd>K</shadcn-kbd></shadcn-kbd-group></shadcn-card-footer>
      </shadcn-card>
      <shadcn-skeleton></shadcn-skeleton>
    </main>
  </body>
</html>
