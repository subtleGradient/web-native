<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>standalone shadcn-button demo</title>
    <script>
      (() => {
        const media = matchMedia("(prefers-color-scheme: dark)")
        const syncTheme = () => {
          document.documentElement.dataset.theme = media.matches ? "dark" : "light"
        }

        syncTheme()
        media.addEventListener("change", syncTheme)
      })()
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/subtleGradient/web-native@7ed806104e4b9dcce8b91044149cb721f2b1e9cf/src/shadcn.web/themes/neutral.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/subtleGradient/web-native@7ed806104e4b9dcce8b91044149cb721f2b1e9cf/src/shadcn.web/styles/base-nova.css" />
    <script type="importmap">{ "imports": { "web-native/": "https://cdn.jsdelivr.net/gh/subtleGradient/web-native@dd21d01da080b25e1269b23e68915d6404e8099d/src/" } }</script>
    <script type="module">
      import "https://cdn.jsdelivr.net/gh/subtleGradient/web-native@e6d861c101d885abfae0b4fd27a5bfa2eb2b9510/src/shadcn.web/button/define.js"
      await customElements.whenDefined("shadcn-button")
      Reflect.set(globalThis, "__webNativeStandaloneDemoReady", true)
    </script>
    <style>body { margin: 2rem; } main { display: grid; gap: 1rem; max-width: 40rem; } .row { display: flex; flex-wrap: wrap; gap: 0.5rem; }</style>
  </head>
  <body>
    <main>
      <h1>standalone shadcn-button</h1>
      <p>Open this file directly. CSS and ESM load from GitHub through jsDelivr.</p>
      <section class="row" aria-label="Button variants">
        <shadcn-button>Default</shadcn-button>
        <shadcn-button variant="outline">Outline</shadcn-button>
        <shadcn-button variant="secondary">Secondary</shadcn-button>
        <shadcn-button variant="ghost">Ghost</shadcn-button>
        <shadcn-button variant="destructive">Destructive</shadcn-button>
        <shadcn-button disabled>Disabled</shadcn-button>
      </section>
    </main>
  </body>
</html>
