<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>standalone shadcn-tabs demo</title>
    <script>
      (() => {
        const media = matchMedia("(prefers-color-scheme: dark)")
        const syncTheme = () => {
          document.documentElement.dataset.theme = media.matches ? "dark" : "light"
        }

        syncTheme()
        media.addEventListener("change", syncTheme)
      })()
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/subtleGradient/web-native@561265129bd238e6e6b4dd4650a6ff6402ea16d4/src/shadcn.web/themes/neutral.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/subtleGradient/web-native@561265129bd238e6e6b4dd4650a6ff6402ea16d4/src/shadcn.web/styles/base-nova.css" />
    <script type="importmap">{ "imports": { "web-native/": "https://cdn.jsdelivr.net/gh/subtleGradient/web-native@561265129bd238e6e6b4dd4650a6ff6402ea16d4/src/" } }</script>
    <script type="module">
      import "https://cdn.jsdelivr.net/gh/subtleGradient/web-native@561265129bd238e6e6b4dd4650a6ff6402ea16d4/src/shadcn.web/tabs/define.js"
      await customElements.whenDefined("shadcn-tabs")
      Reflect.set(globalThis, "__webNativeStandaloneDemoReady", true)
    </script>
    <style>body { margin: 2rem; } main { display: grid; gap: 1rem; max-width: 48rem; }</style>
  </head>
  <body>
    <main>
      <h1>standalone shadcn-tabs</h1>
      <p>Open this file directly. CSS and ESM load from GitHub through jsDelivr.</p>
      <shadcn-tabs value="profile">
        <shadcn-tabs-list variant="line" aria-label="Account sections">
          <shadcn-tabs-trigger value="profile">Profile</shadcn-tabs-trigger>
          <shadcn-tabs-trigger value="security">Security</shadcn-tabs-trigger>
          <shadcn-tabs-trigger value="billing" disabled>Billing</shadcn-tabs-trigger>
        </shadcn-tabs-list>
        <shadcn-tabs-content value="profile">Profile details go here.</shadcn-tabs-content>
        <shadcn-tabs-content value="security">Security controls go here.</shadcn-tabs-content>
        <shadcn-tabs-content value="billing">Billing is disabled.</shadcn-tabs-content>
      </shadcn-tabs>
    </main>
  </body>
</html>
