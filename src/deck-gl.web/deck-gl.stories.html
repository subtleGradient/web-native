<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>deck-gl component stories</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { background: Canvas; color: CanvasText; font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; }
      main { display: grid; gap: 1rem; margin-inline: auto; max-width: 72rem; padding: clamp(1rem, 4vw, 3rem); }
      h1 { font-size: clamp(2rem, 7vw, 4rem); letter-spacing: -0.06em; line-height: 0.9; margin: 0; }
      h2, p { margin-block: 0; }
      [data-story] { background: color-mix(in oklch, Canvas 92%, CanvasText 8%); border: 1px solid color-mix(in oklch, CanvasText 14%, transparent); border-radius: 1rem; display: grid; gap: 1rem; padding: 1rem; }
      .deck-shell { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr) minmax(14rem, 18rem); }
      deck-gl { background: linear-gradient(135deg, #0f172a, #172554 55%, #312e81); border-radius: 1rem; min-height: 18rem; overflow: hidden; }
      deck-layer-list, deck-details-panel { display: block; }
      output { color: color-mix(in oklch, CanvasText 62%, transparent); min-height: 1.5rem; }
      @media (max-width: 760px) { .deck-shell { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>deck-gl elements</h1>
        <p>Stories for deck readiness, layer visibility, detail panels, inline handlers, and the real deck.gl renderer.</p>
      </header>
      <section data-story="fixture-controls">
        <h2>Fixture controls</h2>
        <div class="deck-shell">
          <deck-gl
            id="storybook-deck"
            controller
            initial-view-state='{"longitude":-98,"latitude":39,"zoom":3}'
            oninit="DeckStories.init.call(this, event)"
            onload="DeckStories.loaded()"
            onhover="DeckStories.preview(event)"
            ondeckclick="DeckStories.pin(event)"
            onviewstatechange="DeckStories.syncView(event)"
          ></deck-gl>
          <div>
            <deck-layer-list
              id="storybook-layers"
              label="Operational layers"
              items='[
                {"id":"airports","label":"Airports","visible":true,"swatch":"#22c55e","count":7,"description":"Local fixture points"},
                {"id":"routes","label":"Routes","visible":true,"swatch":"#f97316","count":6},
                {"id":"weather","label":"Weather","visible":false,"swatch":"#38bdf8","count":3}
              ]'
              onlayervisibilitychange="DeckStories.layerChanged(event)"
            ></deck-layer-list>
            <deck-details-panel id="storybook-details" for="storybook-deck" empty="Click the fixture map to select an airport." ondetailschange="DeckStories.detailsChanged(event)"></deck-details-panel>
            <output id="deck-output">No layer changes yet.</output>
          </div>
        </div>
      </section>
    </main>
    <script type="module">
      import { Deck } from "https://esm.sh/@deck.gl/core@9.3.2"
      import { ArcLayer, ScatterplotLayer, TextLayer } from "https://esm.sh/@deck.gl/layers@9.3.2?deps=@deck.gl/core@9.3.2&exports=ArcLayer,ScatterplotLayer,TextLayer"

      const airports = [
        { code: "SEA", name: "Seattle Field", coordinates: [-122.3, 47.6], capacity: 76, status: "stable" },
        { code: "DEN", name: "Denver Hub", coordinates: [-104.9, 39.7], capacity: 88, status: "stable" },
        { code: "MSP", name: "Twin Cities Depot", coordinates: [-93.2, 44.9], capacity: 58, status: "strained" },
        { code: "DFW", name: "Dallas Staging", coordinates: [-97, 32.8], capacity: 91, status: "stable" },
        { code: "ATL", name: "Atlanta Relief", coordinates: [-84.4, 33.6], capacity: 84, status: "stable" },
        { code: "MIA", name: "Miami Medical", coordinates: [-80.2, 25.8], capacity: 49, status: "strained" },
        { code: "JFK", name: "New York Intake", coordinates: [-73.8, 40.7], capacity: 67, status: "stable" },
      ]

      const routes = [
        { source: "SEA", target: "DEN", priority: 2, cargo: "generators", color: [251, 146, 60, 220] },
        { source: "DEN", target: "DFW", priority: 3, cargo: "water", color: [249, 115, 22, 230] },
        { source: "DFW", target: "ATL", priority: 4, cargo: "medical kits", color: [239, 68, 68, 235] },
        { source: "ATL", target: "MIA", priority: 3, cargo: "field beds", color: [249, 115, 22, 230] },
        { source: "MSP", target: "JFK", priority: 2, cargo: "food pallets", color: [251, 146, 60, 220] },
        { source: "JFK", target: "ATL", priority: 1, cargo: "staff", color: [253, 186, 116, 220] },
      ]

      const weather = [
        { name: "Icing watch", coordinates: [-96, 44], radiusMeters: 270000, severity: "moderate", fillColor: [56, 189, 248, 46] },
        { name: "Thunderstorm cell", coordinates: [-88, 31], radiusMeters: 310000, severity: "high", fillColor: [14, 165, 233, 64] },
        { name: "Crosswind band", coordinates: [-112, 37], radiusMeters: 240000, severity: "low", fillColor: [125, 211, 252, 38] },
      ]

      const airportsByCode = new Map(airports.map((airport) => [airport.code, airport]))
      const activeLayers = new Map([
        ["airports", true],
        ["routes", true],
        ["weather", false],
      ])

      globalThis.DeckStories = {
        deckElement: null,
        init(event) {
          globalThis.DeckStories.deckElement = this
          this.deckConstructor = Deck
          this.parameters = { clearColor: [0, 0, 0, 0] }
          this.getTooltip = ({ object }) => object?.name
          this.layers = globalThis.DeckStories.layers()
        },
        layers() {
          const routeData = routes.flatMap((route) => {
            const source = airportsByCode.get(route.source)
            const target = airportsByCode.get(route.target)
            return source && target ? [{ ...route, name: `${route.source} to ${route.target}`, sourceAirport: source, targetAirport: target }] : []
          })

          return [
            new ScatterplotLayer({
              id: "weather",
              data: weather,
              visible: activeLayers.get("weather"),
              pickable: true,
              stroked: true,
              filled: true,
              getPosition: (cell) => cell.coordinates,
              getRadius: (cell) => cell.radiusMeters,
              radiusMinPixels: 24,
              radiusMaxPixels: 90,
              radiusUnits: "meters",
              getFillColor: (cell) => cell.fillColor,
              getLineColor: [125, 211, 252, 220],
              getLineWidth: 2,
              lineWidthUnits: "pixels",
            }),
            new ArcLayer({
              id: "routes",
              data: routeData,
              visible: activeLayers.get("routes"),
              pickable: true,
              getSourcePosition: (route) => route.sourceAirport.coordinates,
              getTargetPosition: (route) => route.targetAirport.coordinates,
              getSourceColor: (route) => route.color,
              getTargetColor: (route) => route.color,
              getWidth: (route) => 2 + Number(route.priority),
            }),
            new ScatterplotLayer({
              id: "airports",
              data: airports,
              visible: activeLayers.get("airports"),
              pickable: true,
              stroked: true,
              filled: true,
              getPosition: (airport) => airport.coordinates,
              getRadius: (airport) => 6 + Number(airport.capacity) / 12,
              radiusUnits: "pixels",
              getFillColor: (airport) => (airport.status === "strained" ? [250, 204, 21, 235] : [34, 197, 94, 235]),
              getLineColor: [255, 255, 255, 235],
              getLineWidth: 2,
              lineWidthUnits: "pixels",
            }),
            new TextLayer({
              id: "airport-labels",
              data: airports,
              visible: activeLayers.get("airports"),
              pickable: false,
              getPosition: (airport) => airport.coordinates,
              getText: (airport) => airport.code,
              getColor: [255, 255, 255, 230],
              getPixelOffset: [16, 2],
              getSize: 14,
              getTextAnchor: "start",
              getAlignmentBaseline: "center",
            }),
          ]
        },
        loaded() {
          document.querySelector("#deck-output").textContent = "Loaded real deck.gl story"
          globalThis.__webNativeDeckStoriesReady = true
        },
        layerChanged(event) {
          activeLayers.set(event.detail.id, event.detail.visible)
          this.deckElement.layers = this.layers()
          document.querySelector("#deck-output").textContent = `${event.detail.id}: ${event.detail.visible ? "visible" : "hidden"}`
        },
        preview(event) {
          const object = event.detail.info.object
          if (object) document.querySelector("#deck-output").textContent = `Hovering ${object.name}`
        },
        pin(event) {
          const object = event.detail.info.object
          if (object) document.querySelector("#deck-output").textContent = `Selected ${object.name}`
        },
        detailsChanged(event) {
          document.querySelector("#deck-output").textContent = `Selected ${event.detail.object.name}`
        },
        syncView(event) {
          this.deckElement.viewState = event.detail.viewState
        },
      }

      await import("./define.js")
    </script>
  </body>
</html>
