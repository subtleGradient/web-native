<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>JSON editor demo</title>
    <script type="module" src="https://cdn.jsdelivr.net/gh/subtleGradient/web-native@94fc1cfd3bc72261f184f5b625588e8ff18ed2d1/src/json-editor.web/define.js"></script>
    <style>
      :root {
        --accent: Highlight;
        --border: color-mix(in oklch, CanvasText 12%, transparent);
        --muted: color-mix(in oklch, CanvasText 62%, transparent);
        --surface: color-mix(in oklch, Canvas 96%, CanvasText 4%);
        --surface-strong: color-mix(in oklch, Canvas 91%, CanvasText 9%);
        color-scheme: light dark;
      }

      body {
        background: Canvas;
        color: CanvasText;
        font-family: ui-sans-serif, system-ui, sans-serif;
        line-height: 1.5;
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }

      main {
        display: grid;
        gap: 1.25rem;
        margin-inline: auto;
        max-inline-size: 70rem;
        padding: clamp(1rem, 4vw, 2rem);
      }

      header {
        display: grid;
        gap: 0.35rem;
        max-inline-size: 48rem;
        padding-block: clamp(0.5rem, 3vw, 2rem) 0.25rem;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 4rem);
        font-weight: 650;
        letter-spacing: 0;
        line-height: 1;
        margin: 0;
      }

      p {
        color: var(--muted);
        font-size: 1rem;
        margin: 0;
        max-inline-size: 62ch;
      }

      form {
        background: Canvas;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        display: grid;
        gap: 0;
        overflow: clip;
      }

      .form-header {
        align-items: end;
        background: var(--surface);
        border-block-end: 1px solid color-mix(in oklch, CanvasText 8%, transparent);
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: space-between;
        padding: 1rem;
      }

      .label-text {
        display: grid;
        gap: 0.15rem;
      }

      label {
        display: grid;
        gap: 0;
      }

      .field-title {
        font-size: 0.875rem;
        font-weight: 700;
      }

      .field-description {
        color: var(--muted);
        font-size: 0.875rem;
      }

      json-editor {
        padding: 1rem;
      }

      button {
        background: ButtonFace;
        border: 1px solid var(--border);
        border-radius: 0.375rem;
        color: ButtonText;
        cursor: pointer;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 750;
        min-block-size: 2.25rem;
        padding: 0.45rem 0.75rem;
        width: fit-content;
      }

      button:focus-visible {
        outline: 2px solid color-mix(in oklch, var(--accent) 76%, CanvasText 24%);
        outline-offset: 2px;
      }

      button:hover {
        background: var(--surface-strong);
      }

      .result-panel {
        display: grid;
        gap: 0.5rem;
      }

      .result-heading {
        align-items: center;
        display: flex;
        gap: 0.5rem;
        font-size: 0.875rem;
        font-weight: 700;
      }

      output {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        font: 0.875rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        min-block-size: 3rem;
        overflow: auto;
        padding: 0.875rem;
        white-space: pre-wrap;
      }

      output:empty::before {
        color: var(--muted);
        content: "Submit the form to read the textarea-backed FormData value.";
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      @media (max-width: 42rem) {
        .form-header {
          align-items: stretch;
          display: grid;
        }

        json-editor {
          padding: 0.75rem;
        }

        button {
          width: 100%;
        }
      }
    </style>
    <script type="application/schema+json" id="settings-schema">
{
  "$id": "https://example.test/settings.schema.json",
  "type": "object",
  "required": ["name", "enabled", "rules"],
  "properties": {
    "name": { "type": "string", "minLength": 1 },
    "enabled": { "type": "boolean" },
    "mode": { "enum": ["preview", "live"] },
    "rules": {
      "type": "array",
      "items": { "$ref": "#/$defs/rule" }
    }
  },
  "additionalProperties": false,
  "$defs": {
    "rule": {
      "type": "object",
      "required": ["field", "operator", "value"],
      "properties": {
        "field": { "type": "string" },
        "operator": { "enum": ["equals", "contains", "starts_with"] },
        "value": { "type": "string" }
      },
      "additionalProperties": false
    }
  }
}
    </script>
  </head>
  <body>
    <main>
      <header>
        <h1>JSON editor</h1>
        <p>A textarea-first custom element that behaves like a native form control, with structured fields when a schema is available.</p>
      </header>

      <form onsubmit="event.preventDefault(); result.value = new FormData(this).get('settings')">
        <div class="form-header">
          <div class="label-text" id="settings-label">
            <span class="field-title">Settings JSON</span>
            <span class="field-description">Use the structured fields or open the text value; both stay synced to the textarea.</span>
          </div>
          <button type="submit">Read FormData</button>
        </div>
        <label aria-labelledby="settings-label">
          <json-editor schema="#settings-schema">
            <textarea name="settings" aria-label="Settings JSON">{
  "name": "Demo",
  "enabled": true,
  "mode": "preview",
  "rules": [
    { "field": "title", "operator": "contains", "value": "native" }
  ]
}</textarea>
          </json-editor>
        </label>
      </form>

      <section class="result-panel" aria-labelledby="result-heading">
        <div class="result-heading" id="result-heading">FormData output</div>
        <output id="result"></output>
      </section>
    </main>
  </body>
</html>
