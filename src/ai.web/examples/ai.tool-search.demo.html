<!doctype html>
<!--
Run this demo with the Codex broker
These demos are hard-coded to the local Codex broker exposed by broker-runner.
GitHub:
bunx --bun -p https://github.com/subtleGradient/web-native/archive/7ff0cfd59e29adcb6fe7727669c91d6567296786.tar.gz web-native-ai-broker src/ai.web/examples/ai.tool-search.demo.html
Local checkout:
bun "./src/ai-broker.webapp/broker-runner.ts" src/ai.web/examples/ai.tool-search.demo.html

Security: only run demos you trust. This page sends requests through the runner's local Codex broker.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./ai.demo.css" />
    <title>OpenAI tool search demo</title>
    <script type="module" src="../define.js"></script>
    <script type="module" src="./ai.demo.js"></script>
  </head>
  <body>
    <main>
      <a class="back" data-preserve-search href="./index.html">← All AI demos</a>
      <header>
        <h1>Tool search</h1>
        <p>Demonstrate deferred tool loading with <code>tool_search</code>.</p>
      </header>

      <openai-client id="ai" model="gpt-5.5" transport="codex-broker"></openai-client>

      <form class="panel" onsubmit="ai.respondWithTools(event)">
        <h2>Request</h2>
        <p class="note">Demonstrates deferred tool loading with <code>tool_search</code>; supported by GPT-5.4 and later models.</p>
        <label>Prompt<textarea name="prompt">List open orders for customer CUST-12345.</textarea></label>
        <label>Tools JSON<textarea name="tools">[
  {
    "type": "namespace",
    "name": "crm",
    "description": "CRM tools for customer lookup and order management.",
    "tools": [
      {
        "type": "function",
        "name": "get_customer_profile",
        "description": "Fetch a customer profile by customer ID.",
        "parameters": {
          "type": "object",
          "properties": { "customer_id": { "type": "string" } },
          "required": ["customer_id"],
          "additionalProperties": false
        }
      },
      {
        "type": "function",
        "name": "list_open_orders",
        "description": "List open orders for a customer ID.",
        "defer_loading": true,
        "parameters": {
          "type": "object",
          "properties": { "customer_id": { "type": "string" } },
          "required": ["customer_id"],
          "additionalProperties": false
        }
      }
    ]
  },
  { "type": "tool_search" }
]</textarea></label>
        <input type="hidden" name="parallel_tool_calls" value="false" />
        <button>Search tools</button>
      </form>

      <openai-result for="ai"></openai-result>
    </main>
  </body>
</html>
