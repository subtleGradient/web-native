<!doctype html>
<!--
Run this demo with the Codex broker
These demos are hard-coded to the local Codex broker exposed by broker-runner.
GitHub:
bunx --bun -p https://github.com/subtleGradient/web-native/archive/7ff0cfd59e29adcb6fe7727669c91d6567296786.tar.gz web-native-ai-broker src/ai.web/examples/ai.remote-mcp.demo.html
Local checkout:
bun "./src/ai-broker.webapp/broker-runner.ts" src/ai.web/examples/ai.remote-mcp.demo.html

Security: only run demos you trust. This page sends requests through the runner's local Codex broker.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./ai.demo.css" />
    <title>OpenAI remote MCP demo</title>
    <script type="module" src="../define.js"></script>
    <script type="module" src="./ai.demo.js"></script>
  </head>
  <body>
    <main>
      <a class="back" data-preserve-search href="./index.html">← All AI demos</a>
      <header>
        <h1>Remote MCP</h1>
        <p>Call a public demo MCP server.</p>
      </header>

      <openai-client id="ai" model="gpt-5.5" transport="codex-broker"></openai-client>

      <form class="panel" onsubmit="ai.respondWithTools(event)">
        <h2>Request</h2>
        <p class="note">Calls a public demo MCP server. Only use trusted MCP servers with real data.</p>
        <label>Prompt<textarea name="prompt">Roll 2d4+1.</textarea></label>
        <label>Tools JSON<textarea name="tools">[{"type":"mcp","server_label":"dmcp","server_description":"A Dungeons and Dragons MCP server to assist with dice rolling.","server_url":"https://dmcp-server.deno.dev/sse","require_approval":"never","allowed_tools":["roll"]}]</textarea></label>
        <button>Call MCP</button>
      </form>

      <openai-result for="ai"></openai-result>
    </main>
  </body>
</html>
