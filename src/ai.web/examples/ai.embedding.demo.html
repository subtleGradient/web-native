<!doctype html>
<!--
Run this demo with the Codex broker
These demos are hard-coded to the local Codex broker exposed by broker-runner.
GitHub:
bunx --bun -p https://github.com/subtleGradient/web-native/archive/7ff0cfd59e29adcb6fe7727669c91d6567296786.tar.gz web-native-ai-broker src/ai.web/examples/ai.embedding.demo.html
Local checkout:
bun "./src/ai-broker.webapp/broker-runner.ts" src/ai.web/examples/ai.embedding.demo.html

Security: only run demos you trust. This page sends requests through the runner's local Codex broker.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./ai.demo.css" />
    <title>OpenAI embedding demo</title>
    <script type="module" src="../define.js"></script>
    <script type="module" src="./ai.demo.js"></script>
  </head>
  <body>
    <main>
      <a class="back" data-preserve-search href="./index.html">← All AI demos</a>
      <header>
        <h1>Embedding</h1>
        <p>Create an embedding vector for input text.</p>
      </header>

      <openai-client id="ai" model="gpt-5.5" transport="codex-broker"></openai-client>

      <form class="panel" onsubmit="ai.embed(event)">
        <h2>Request</h2>
        <label>Input<textarea name="prompt">hello vector space</textarea></label>
        <button>Embed</button>
      </form>

      <openai-result for="ai"></openai-result>
    </main>
  </body>
</html>
